<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CodeNova 2.0 - Scam Message &amp; Image Spam Forensics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=asset_v) }}">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 3v6c0 5-3.4 9.2-8 11-4.6-1.8-8-6-8-11V5z"/><path d="M9 12l2 2 4-4"/></svg>
    </div>
    <div>
      <div class="brand-row"><span class="brand-name">CodeNova 2.0</span><span class="chip mono">Python {{ py_version[:4] }} ML + OCR</span></div>
      <div class="brand-sub">Scam Message &amp; Image Spam Percentage Forensics Dashboard</div>
    </div>
  </div>
  <nav class="nav">
    <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint in ('index','view_scan','scan') }}">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Scanner &amp; Output</a>
    <a href="{{ url_for('history') }}" class="{{ 'active' if request.endpoint == 'history' }}">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      Scan History ({{ history_count }})</a>
    
  </nav>
</header>
{% block content %}{% endblock %}
</body>
</html>
